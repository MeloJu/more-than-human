#cloud-config
package_update: true

# As VMs Always Free têm 1GB de RAM (E2.1.Micro na Oracle, e2-micro no GCP) —
# app + Postgres + Caddy cabem, mas sem folga: um pico durante migration ou
# build de página derrubaria o container por OOM. 2GB de swap absorvem o pico
# ao custo de disco, que sobra (cota de 200GB na Oracle, 30GB no GCP).
swap:
  filename: /swapfile
  size: 2147483648
  maxsize: 2147483648

packages:
  - ca-certificates
  - curl
  - gnupg
  - iptables-persistent

runcmd:
  # Docker Engine + plugin do compose (docker compose v2)
  - install -m 0755 -d /etc/apt/keyrings
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
  - chmod a+r /etc/apt/keyrings/docker.asc
  - >
    sh -c 'echo "deb [arch=$(dpkg --print-architecture)
    signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu
    $(. /etc/os-release && echo $VERSION_CODENAME) stable"
    > /etc/apt/sources.list.d/docker.list'
  - apt-get update
  - apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
  - usermod -aG docker ubuntu

  # Pasta onde o docker-compose.prod.yml/Caddyfile/.env vão morar (ver
  # docs/deploy-oracle.md ou docs/deploy-gcp.md)
  - mkdir -p /home/ubuntu/animebattler
  - chown ubuntu:ubuntu /home/ubuntu/animebattler

  # Algumas imagens Ubuntu de cloud vêm com iptables bloqueando por padrão
  # além do firewall do provedor (security list na Oracle, firewall rules
  # no GCP) — libera 80/443 direto no SO e persiste entre reboots.
  # Inserido no topo da chain (posição 1) pra sempre vencer qualquer regra
  # de DROP que já exista mais abaixo. Idempotente/inofensivo nos provedores
  # onde isso já vem liberado.
  # Serviços de desktop que a imagem Ubuntu traz e uma VM de nuvem não usa.
  # Medido na E2.1.Micro: o fwupd (atualizador de firmware) sozinho ocupava
  # 119 MB dos 956 MB — mais que o jogo. Desligar os três abriu espaço para o
  # monitoramento. iscsid e multipathd ficam: o disco da VM pode depender deles.
  - systemctl disable --now fwupd.service packagekit.service udisks2.service
  - systemctl mask fwupd.service packagekit.service udisks2.service

  - iptables -I INPUT 1 -p tcp --dport 443 -j ACCEPT
  - iptables -I INPUT 1 -p tcp --dport 80 -j ACCEPT
  - netfilter-persistent save
