# Compose de produção — roda na VM, não localmente. No repo mora em deploy/,
# junto com o Caddyfile; a pipeline copia os dois soltos para ~/animebattler
# na VM, ao lado do .env. Diferenças pro
# docker-compose.yml de dev: sem bind mount (usa a imagem já publicada no
# GHCR pelo CD), Caddy na frente fazendo TLS, nenhuma porta de app/db
# exposta direto pro host. Segredos vêm de um .env que só existe na VM
# (nunca commitado — ver .env.prod.example / docs/deploy-oracle.md / docs/deploy-gcp.md).
#
# POSTGRES_USER e POSTGRES_PASSWORD NÃO TÊM VALOR-PADRÃO de propósito — usam
# ${VAR:?mensagem}, que falha o `docker compose` na hora de ler o arquivo se
# a variável não estiver definida, em vez de cair silenciosamente num valor
# fixo. Antes POSTGRES_USER tinha `:-animebattler` como padrão: funcionava,
# mas deixava o usuário do banco de produção público e igual em toda
# instalação, escrito no compose que é o arquivo versionado. Não chegava a
# ser uma senha vazada — o db não tem porta exposta pro host, e autenticação
# exige usuário E senha — mas usuário fixo e previsível é uma fresta a menos
# de informação que não precisa estar aberta. POSTGRES_DB continua com
# padrão: nome de banco não é segredo do mesmo jeito.
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy

  app:
    # IMAGE_TAG é fixado no SHA do commit pelo workflow de deploy — dá pra saber
    # exatamente qual commit está no ar, e rollback é só trocar a tag.
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-owner}/animebattler:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:?defina POSTGRES_USER no .env da VM}:${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env da VM}@db:5432/${POSTGRES_DB:-animebattler}?schema=public
      # Sem domínio (acessando pelo IP), o Caddy serve HTTP puro e o navegador
      # descarta cookie Secure — o login falha calado. Ver .env.prod.example.
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
    volumes:
      # O cache das imagens otimizadas pelo next/image. Dentro do container ele
      # morria a cada deploy, e toda imagem voltava a ser convertida no primeiro
      # pedido (1 a 5 s cada, na VM). No volume, cada imagem é convertida uma vez.
      - imagens_otimizadas:/app/.next/cache/images
    depends_on:
      db:
        condition: service_healthy
    # Sem `command:` aqui de propósito: o CMD da imagem já roda
    # `prisma migrate deploy` antes de subir o servidor.
    healthcheck:
      # 127.0.0.1, não `localhost`: no Alpine/musl o `localhost` resolve pra
      # ::1 (IPv6) primeiro, e o Next escuta em 0.0.0.0 (só IPv4) — o wget
      # levava "connection refused" e o container ficava eternamente unhealthy
      # mesmo com a aplicação respondendo normalmente.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      # start_period cobre o tempo do migrate deploy antes do servidor existir,
      # sem contar como falha.
      start_period: 60s
      interval: 15s
      timeout: 5s
      retries: 5

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?defina POSTGRES_USER no .env da VM}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env da VM}
      POSTGRES_DB: ${POSTGRES_DB:-animebattler}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?defina POSTGRES_USER no .env da VM}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  imagens_otimizadas:
  caddy_data:
  caddy_config:
