# Compose de produção — roda na VM, não localmente. No repo mora em deploy/,
# junto com o Caddyfile; a pipeline copia os dois soltos para ~/animebattler
# na VM, ao lado do .env. Diferenças pro
# docker-compose.yml de dev: sem bind mount (usa a imagem já publicada no
# GHCR pelo CD), Caddy na frente fazendo TLS, nenhuma porta de app/db
# exposta direto pro host. Segredos vêm de um .env que só existe na VM
# (nunca commitado — ver .env.prod.example / docs/deploy-oracle.md / docs/deploy-gcp.md).
#
# POSTGRES_USER e POSTGRES_PASSWORD NÃO TÊM VALOR-PADRÃO de propósito — usam
# ${VAR:?mensagem}, que falha o `docker compose` na hora de ler o arquivo se
# a variável não estiver definida, em vez de cair silenciosamente num valor
# fixo. Antes POSTGRES_USER tinha `:-animebattler` como padrão: funcionava,
# mas deixava o usuário do banco de produção público e igual em toda
# instalação, escrito no compose que é o arquivo versionado. Não chegava a
# ser uma senha vazada — o db não tem porta exposta pro host, e autenticação
# exige usuário E senha — mas usuário fixo e previsível é uma fresta a menos
# de informação que não precisa estar aberta. POSTGRES_DB continua com
# padrão: nome de banco não é segredo do mesmo jeito.
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy

  app:
    # IMAGE_TAG é fixado no SHA do commit pelo workflow de deploy — dá pra saber
    # exatamente qual commit está no ar, e rollback é só trocar a tag.
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-owner}/animebattler:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:?defina POSTGRES_USER no .env da VM}:${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env da VM}@db:5432/${POSTGRES_DB:-animebattler}?schema=public
      # Sem domínio (acessando pelo IP), o Caddy serve HTTP puro e o navegador
      # descarta cookie Secure — o login falha calado. Ver .env.prod.example.
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
    volumes:
      # O cache das imagens otimizadas pelo next/image. Dentro do container ele
      # morria a cada deploy, e toda imagem voltava a ser convertida no primeiro
      # pedido (1 a 5 s cada, na VM). No volume, cada imagem é convertida uma vez.
      - imagens_otimizadas:/app/.next/cache/images
    depends_on:
      db:
        condition: service_healthy
    # Sem `command:` aqui de propósito: o CMD da imagem já roda
    # `prisma migrate deploy` antes de subir o servidor.
    healthcheck:
      # 127.0.0.1, não `localhost`: no Alpine/musl o `localhost` resolve pra
      # ::1 (IPv6) primeiro, e o Next escuta em 0.0.0.0 (só IPv4) — o wget
      # levava "connection refused" e o container ficava eternamente unhealthy
      # mesmo com a aplicação respondendo normalmente.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      # start_period cobre o tempo do migrate deploy antes do servidor existir,
      # sem contar como falha.
      start_period: 60s
      interval: 15s
      timeout: 5s
      retries: 5

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?defina POSTGRES_USER no .env da VM}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env da VM}
      POSTGRES_DB: ${POSTGRES_DB:-animebattler}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?defina POSTGRES_USER no .env da VM}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---------- MONITORAMENTO ----------
  #
  # Prometheus coleta, node-exporter mede a VM, Grafana desenha (em /grafana,
  # atrás do Caddy, com login). A VM tem 1 GB de RAM, então CADA serviço tem
  # teto de memória: se alguém tiver de cair por falta de memória, cai o
  # monitoramento, nunca o jogo. Medido antes de subir: 452 MB disponíveis
  # (depois de desligar fwupd, packagekit e udisks2, ver cloud-init).
  prometheus:
    image: prom/prometheus:v3.15.0
    restart: unless-stopped
    mem_limit: 192m
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # Duas travas de retenção: 15 dias OU 1 GB, o que vier primeiro.
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=1GB
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    # Só no 127.0.0.1 da VM: nada de internet. Para abrir no navegador,
    # um túnel: ssh -L 9090:localhost:9090 ubuntu@<ip>, e http://localhost:9090.
    ports:
      - "127.0.0.1:9090:9090"

  node-exporter:
    image: prom/node-exporter:v1.12.1
    restart: unless-stopped
    mem_limit: 48m
    # Mede a VM, não o container: enxerga o / do host (só leitura) e os
    # processos do host.
    command:
      - --path.rootfs=/host
    pid: host
    volumes:
      - /:/host:ro,rslave

  grafana:
    image: grafana/grafana-oss:13.0.2
    restart: unless-stopped
    mem_limit: 256m
    environment:
      # O Go só aperta o coletor de lixo perto deste valor: abaixo do teto do
      # container (256m), para o Grafana se conter antes de ser morto por OOM.
      GOMEMLIMIT: 200MiB
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?defina GRAFANA_ADMIN_PASSWORD no .env da VM}
      # Servido em https://<site>/grafana, atrás do Caddy.
      GF_SERVER_ROOT_URL: https://${SITE_ADDRESS:-localhost}/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      # Ninguém se cadastra nem entra sem login.
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      # Nada de baixar plugin, checar versão ou mandar estatística no boot:
      # memória e rede contadas.
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  pgdata:
  imagens_otimizadas:
  prometheus_data:
  grafana_data:
  caddy_data:
  caddy_config:
