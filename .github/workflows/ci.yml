name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  build-and-check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: animebattler
          POSTGRES_PASSWORD: animebattler
          POSTGRES_DB: animebattler
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U animebattler"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://animebattler:animebattler@localhost:5432/animebattler?schema=public

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      # Testes de lógica pura (motor de batalha, IA, progressão, helpers).
      # Rodam antes do build porque falham em segundos — não faz sentido
      # esperar o build inteiro pra descobrir que a regra de dano quebrou.
      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  # Job separado porque o `npm run build` acima passava mesmo com o Dockerfile
  # quebrado — a imagem nunca era construída no CI, e o erro só apareceria no
  # deploy. E buildar também não basta: a imagem antiga buildava e ainda assim
  # não servia tráfego. Por isso aqui ela é construída E executada.
  docker-image:
    name: Imagem Docker (build + smoke test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      # Build nativo amd64, só pra validar o Dockerfile rápido. O artefato que
      # vai pra produção é buildado e publicado no deploy.yml.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: animebattler:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: bash scripts/smoke-test.sh animebattler:ci

  # Segredo commitado é o tipo de erro que não dá para desfazer: uma vez no
  # histórico de um repositório PÚBLICO, considera-se vazado mesmo depois de
  # removido — o commit antigo continua acessível e provavelmente já foi
  # clonado. Por isso a checagem é automática e bloqueia o merge, em vez de
  # depender de alguém lembrar de olhar.
  #
  # RODA O HISTÓRICO INTEIRO (fetch-depth: 0), não só o diff: o custo é de
  # segundos num repo deste tamanho, e limitar ao diff deixaria passar
  # qualquer coisa que já estivesse lá atrás. A primeira execução veio limpa
  # nos 114 commits de então.
  #
  # BINÁRIO DIRETO em vez da action oficial, de propósito: uma action de
  # terceiro roda com acesso ao contexto do workflow, e aqui basta um
  # executável com versão fixada. Mesmo raciocínio do comentário sobre
  # actions em .github/dependabot.yml.
  segredos:
    name: Segredos (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instalar gitleaks
        env:
          VERSAO: 8.30.1
        run: |
          curl -sSL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${VERSAO}/gitleaks_${VERSAO}_linux_x64.tar.gz"
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks version

      - name: Varrer o histórico
        run: ./gitleaks git --redact --verbose

  # Analisa os .tf de infra/ contra política de segurança (SSH aberto pro
  # mundo, disco sem criptografia em trânsito, etc.) — achado real que já
  # apareceu neste projeto: security list da Oracle e firewall do GCP com
  # 0.0.0.0/0 na porta 22 antes desta passagem.
  #
  # NÃO PRECISA de credencial de nuvem: Checkov lê o .tf estaticamente, não
  # chama a API de ninguém. Roda sem `terraform init`, de propósito — a
  # varredura independe do provider estar baixado.
  #
  # ACHADO SEM CORREÇÃO ACEITÁVEL fica com `# checkov:skip=ID: motivo`
  # dentro do próprio bloco do recurso (ver infra/gcp/main.tf e
  # infra/oracle-bootstrap/main.tf) — a ferramenta reporta como "skipped",
  # não como sucesso silencioso, e o motivo fica registrado ao lado do
  # recurso, não perdido num comentário de PR.
  infra:
    name: Infraestrutura (checkov)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: infra
          quiet: true
          compact: true
          soft_fail: false
