name: Deploy

# Dispara sozinho quando o CI passa em master, e não no push.
#
# A diferença importa: com gatilho em `push`, o deploy correria EM PARALELO
# com o CI, então um commit que quebra teste ou tipo iria para produção do
# mesmo jeito — o CI ficaria vermelho depois, com o defeito já no ar. Com
# workflow_run + conclusion == 'success', nada sobe sem ter passado.
#
# workflow_dispatch continua, para redeploy e rollback à mão (rodar a partir
# de outro commit republica aquela imagem).
#
# Secrets necessários: DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY
# (ver docs/deploy-oracle.md).
on:
  workflow_dispatch:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [master]

# UM DEPLOY POR VEZ. Dois pushes seguidos terminam o CI com segundos de
# diferença, e os dois deploys puxavam a imagem na VM ao mesmo tempo: o
# containerd de lá falhou ao gravar a mesma camada duas vezes ("failed commit
# on ref layer-sha256..."). Na fila, o seguinte espera o anterior terminar;
# sem cancelar o que já está rodando, para nunca derrubar um deploy no meio.
concurrency:
  group: deploy-producao
  cancel-in-progress: false

# Em workflow_run, github.sha aponta para o commit do ramo padrão, NÃO para o
# que o CI validou. Usar head_sha garante que se publica exatamente o que
# passou nos testes; no disparo manual, github.sha já é o certo.
env:
  DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  build-and-push:
    # Disparo manual roda sempre; disparo por CI só quando ele passou.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    # A arquitetura aqui TEM que bater com a da VM, senão o container morre na
    # hora com "exec format error". Hoje a VM é uma E2.1.Micro (amd64), porque
    # a Ampere/aarch64 do Always Free segue sem capacidade em sa-saopaulo-1.
    # Se um dia a Ampere sair (infra/oracle, enable_ampere), é só voltar isto
    # pra `ubuntu-24.04-arm` + `linux/arm64` — ambos são runners nativos e
    # gratuitos em repositório público.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.DEPLOY_SHA }}

      # O GHCR só aceita nome de repositório em minúsculas, mas o login do
      # GitHub pode ter maiúsculas (MeloJu). Usar github.repository_owner cru
      # faz o buildx falhar com "repository name must be lowercase".
      - name: Compute image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/animebattler" >> "$GITHUB_ENV"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            GIT_SHA=${{ env.DEPLOY_SHA }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ env.DEPLOY_SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Roda a imagem recém-publicada, nativamente, neste runner. É o artefato
      # exato que vai pra VM — não um primo de outra arquitetura. Se falhar
      # aqui, o job `deploy` nem começa e a VM não é tocada.
      - name: Smoke test the image
        run: |
          docker pull ${{ env.IMAGE }}:${{ env.DEPLOY_SHA }}
          bash scripts/smoke-test.sh ${{ env.IMAGE }}:${{ env.DEPLOY_SHA }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.DEPLOY_SHA }}

      # Mantém compose e Caddyfile da VM em sincronia com o repo. Antes isso
      # era um scp manual feito uma vez, que ia silenciosamente ficando velho a
      # cada mudança no repositório.
      - name: Copy compose files to VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "docker-compose.prod.yml,Caddyfile"
          target: "~/animebattler"

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          IMAGE_TAG: ${{ env.DEPLOY_SHA }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: GHCR_TOKEN,GHCR_USER,IMAGE_TAG
          script: |
            set -e
            cd ~/animebattler

            # A imagem no GHCR nasce privada, então a VM precisa autenticar pra
            # dar pull. Este token vale só enquanto este job roda — melhor que
            # deixar um PAT permanente guardado na VM.
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

            # Fixa a imagem no SHA do commit em vez de :latest — dá pra saber
            # exatamente o que está no ar, e rollback vira só rodar o workflow
            # de novo a partir de outro commit.
            export IMAGE_TAG

            # Grava a versão implantada no .env da VM.
            #
            # Sem isto, o `${IMAGE_TAG:-latest}` do compose faz qualquer
            # `docker compose up` rodado à mão na VM cair no `latest` — e o
            # `latest` local nunca é atualizado, porque o pull acima só baixa a
            # tag do SHA. O resultado é produção voltar em silêncio para a
            # primeira imagem já baixada, sem erro nenhum no caminho.
            if grep -q '^IMAGE_TAG=' .env 2>/dev/null; then
              sed -i "s|^IMAGE_TAG=.*|IMAGE_TAG=$IMAGE_TAG|" .env
            else
              echo "IMAGE_TAG=$IMAGE_TAG" >> .env
            fi

            # LIMPA ANTES DE BAIXAR, não só depois — achado real: a limpeza
            # antiga só rodava no FIM deste script, então um deploy que
            # falhasse antes de chegar lá (por qualquer motivo) nunca liberava
            # espaço, e o PRÓXIMO deploy tinha ainda menos disco livre que o
            # anterior. Bastou uma sequência de deploys sem falha nenhuma pra
            # entupir o disco de 45GB só de imagem antiga (~25 acumuladas,
            # 1.3GB cada) e todo deploy seguinte falhar com "no space left on
            # device" — inclusive um que carregava correção de RCE crítico.
            #
            # -a (não só dangling): cada deploy marca a imagem com o SHA do
            # commit, então ela nunca fica "dangling" — fica tagueada e
            # esquecida. Sem -a, prune nunca tocava nela. Seguro mesmo assim:
            # prune -a só remove imagem sem NENHUM container (rodando ou
            # parado) referenciando ela — a que está de pé fica de fora.
            docker image prune -af

            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            # Deploy só termina quando o healthcheck passa de verdade. Sem isso
            # o job ficava verde mesmo com o container em loop de restart.
            echo "Aguardando o app ficar healthy..."
            for i in $(seq 1 40); do
              cid=$(docker compose -f docker-compose.prod.yml ps -q app)
              status=$(docker inspect --format '{{.State.Health.Status}}' "$cid" 2>/dev/null || echo starting)
              if [ "$status" = "healthy" ]; then
                echo "✔ app healthy ($IMAGE_TAG)"
                break
              fi
              if [ "$i" -eq 40 ]; then
                echo "✖ app não ficou healthy. Últimos logs:"
                docker compose -f docker-compose.prod.yml logs --tail=80 app
                exit 1
              fi
              sleep 5
            done

            # Catálogo entra DEPOIS do app estar healthy, e não antes: ele fala
            # com o banco pelo container do app, que só existe quando o
            # `prisma migrate deploy` do CMD já terminou. Rodar antes pegaria o
            # schema velho.
            #
            # Era o único passo manual que sobrava no deploy — subir a imagem
            # publicava o CÓDIGO novo mas deixava o CONTEÚDO velho, então
            # personagem, arco de história e habilidade novos simplesmente não
            # apareciam, sem erro nenhum no caminho.
            #
            # É idempotente e não toca em tabela de jogador: rodar duas vezes
            # seguidas imprime "catálogo já está em dia" na segunda.
            echo "Sincronizando catálogo..."
            docker compose -f docker-compose.prod.yml exec -T app npm run catalog:sync

            # A VERIFICAÇÃO É A ÚLTIMA COISA, e a ordem foi aprendida errando:
            # ela ficava antes do catalog:sync, então quando falhava impedia a
            # sincronização de rodar — deixando código novo com conteúdo velho,
            # que é exatamente o problema que aquele passo existe para evitar.
            #
            # Verificar é asserção, não etapa: tudo o que o deploy precisa fazer
            # acontece primeiro, e só então se confere se deu certo.
            # Confere que o container respondendo é REALMENTE o commit que este
            # job publicou. O healthcheck acima só prova que algo saudável está
            # de pé — se a VM tivesse puxado uma imagem velha do cache, ou se o
            # compose tivesse mantido o container anterior, ele passaria igual.
            #
            # Esta era a lacuna que fazia "a mudança não apareceu" ser uma
            # pergunta sem resposta: deploy pendente, cache do navegador e bug
            # de verdade se pareciam.
            #
            # 127.0.0.1 e NÃO `localhost`, pela mesma razão já documentada no
            # healthcheck do docker-compose.prod.yml: no Alpine/musl o
            # `localhost` resolve para ::1 primeiro e o Next escuta só em IPv4,
            # então o wget leva "connection refused" com a aplicação de pé. A
            # primeira versão deste passo caiu exatamente nessa armadilha.
            no_ar=$(docker compose -f docker-compose.prod.yml exec -T app wget -qO- http://127.0.0.1:3000/api/health | grep -o '"version":"[^"]*"' | cut -d'"' -f4)
            if [ "$no_ar" != "$IMAGE_TAG" ]; then
              echo "✖ versão no ar ($no_ar) não é a publicada ($IMAGE_TAG)"
              exit 1
            fi
            echo "✔ versão confirmada no ar: $no_ar"

